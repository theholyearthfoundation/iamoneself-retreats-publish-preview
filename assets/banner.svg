<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">I Am One Self</title>
  <desc id="d">The Eagle and the Condor, flying as one. The picture: a sun held by an open circle, and 5 waves drawing in beneath it. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f271b"/><stop offset="1" stop-color="#18181a"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#b45309"/><stop offset="0.50" stop-color="#d97706"/><stop offset="1.00" stop-color="#edbb70"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#d97706" stop-opacity="0"/><stop offset=".35" stop-color="#d97706"/><stop offset="1" stop-color="#edbb70"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <circle class="breathe" cx="933.7" cy="103.8" r="46" fill="url(#line)"/>
    <path class="draw" pathLength="100" d="M993.0 74.7A66 66 0 1 1 938.2 38.0" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.20s"/>
    <path class="draw" pathLength="100" d="M620 164.0Q679.4 145.5 738.7 164.0Q798.1 182.5 857.5 164.0Q916.8 145.5 976.2 164.0Q1035.6 182.5 1094.9 164.0Q1154.3 145.5 1213.7 164.0Q1273.0 182.5 1332.4 164.0" fill="none" stroke="url(#fade)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.40s"/>
    <path class="draw" pathLength="100" d="M620 178.5Q677.8 197.8 735.7 178.5Q793.5 159.2 851.3 178.5Q909.1 197.8 967.0 178.5Q1024.8 159.2 1082.6 178.5Q1140.4 197.8 1198.3 178.5Q1256.1 159.2 1313.9 178.5" fill="none" stroke="url(#fade)" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.90s"/>
    <path class="draw" pathLength="100" d="M620 193.0Q682.5 180.1 745.0 193.0Q807.6 205.9 870.1 193.0Q932.6 180.1 995.1 193.0Q1057.6 205.9 1120.1 193.0Q1182.7 180.1 1245.2 193.0" fill="none" stroke="url(#fade)" stroke-width="2.4000000000000004" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.40s"/>
    <path class="draw" pathLength="100" d="M620 207.5Q692.6 184.5 765.1 207.5Q837.7 230.5 910.3 207.5Q982.8 184.5 1055.4 207.5Q1128.0 230.5 1200.5 207.5Q1273.1 184.5 1345.7 207.5" fill="none" stroke="url(#fade)" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.90s"/>
    <path class="draw" pathLength="100" d="M620 222.0Q699.6 240.5 779.2 222.0Q858.7 203.5 938.3 222.0Q1017.9 240.5 1097.5 222.0Q1177.0 203.5 1256.6 222.0" fill="none" stroke="url(#fade)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:2.40s"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#6b4f1d"/><rect x="300.0" y="248" width="300.5" height="12" fill="#b45309"/><rect x="600.0" y="248" width="300.5" height="12" fill="#d97706"/><rect x="900.0" y="248" width="300.5" height="12" fill="#fef3c7"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="72.0" fill="#d97706" font-size="15" font-weight="700" letter-spacing=".6">The Holy Earth Foundation</text><text x="56" y="137.6" fill="#fef3c7" font-size="60" font-weight="700" letter-spacing="-.5">I Am One Self</text><text x="56" y="181.4" fill="#e1d6af" font-size="23">The Eagle and the Condor, flying as one.</text></g>
  </g>
</svg>
